<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HR Система{% endblock %}</title>
    <!-- Подключаем Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Иконки Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background-color: #212529; color: white; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 10px 15px; display: block; }
        .sidebar a:hover, .sidebar a.active { background-color: #0d6efd; color: white; border-radius: 5px; }
        .content { padding: 20px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Боковое меню -->
        <nav class="col-md-2 d-none d-md-block sidebar p-3">
            <h4 class="text-white text-center mb-4">HR Система</h4>
            <ul class="nav flex-column">
                <li class="nav-item"><a href="{% url 'dashboard' %}" class="nav-link"><i class="bi bi-speedometer2"></i> Дашборд</a></li>
                <li class="nav-item"><a href="{% url 'employee_list' %}" class="nav-link"><i class="bi bi-people"></i> Сотрудники</a></li>
               <li class="nav-item"><a href="{% url 'department_list' %}" class="nav-link"><i class="bi bi-building"></i> Отделы</a></li>
                <li class="nav-item"><a href="{% url 'vacation_list' %}" class="nav-link"><i class="bi bi-calendar-check"></i> Отпуска</a></li>
                <li class="nav-item"><a href="{% url 'attendance_list' %}" class="nav-link"><i class="bi bi-clock-history"></i> Табель</a></li>
                <li class="nav-item mt-4"><a href="{% url 'admin:index' %}" class="nav-link text-warning"><i class="bi bi-gear"></i> Админка</a></li>
            </ul>
        </nav>

        <!-- Основной контент -->
        <main class="col-md-10 ms-sm-auto content">
            <!-- Сообщения об успехе/ошибке -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            {% block content %}
            <!-- Сюда будут вставляться страницы -->
            {% endblock %}
        </main>
    </div>
</div>

<!-- Bootstrap JS (для выпадающих меню и закрытия алертов) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
